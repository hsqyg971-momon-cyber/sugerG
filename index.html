<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>フクロモモンガスロット - MOMONGA CYBER RUSH</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,800&family=M+PLUS+Rounded+1c:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Chakra Petch', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at 50% 20%, #1e1136 0%, #0a0614 70%, #030108 100%);
    }

    .font-digital {
      font-family: 'Orbitron', 'Chakra Petch', monospace;
    }

    /* Cyber Cabinet Neon Glow */
    .cabinet-glow {
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.35), 0 0 70px rgba(6, 182, 212, 0.2), inset 0 0 20px rgba(168, 85, 247, 0.25);
    }

    /* Stop Button Pulsing Glow for Active Order */
    @keyframes pulse-neon {
      0%, 100% {
        box-shadow: 0 0 16px #f43f5e, 0 4px 0 #881337, inset 0 1px 2px #ffe4e6;
        transform: translateY(0);
      }
      50% {
        box-shadow: 0 0 32px #fb7185, 0 0 48px #f43f5e, 0 4px 0 #881337, inset 0 1px 6px #fff;
        transform: translateY(-2px);
      }
    }
    .btn-active-glow {
      animation: pulse-neon 0.9s infinite ease-in-out;
    }

    /* Rainbow Aura for Bushbaby Premium */
    @keyframes rainbow-border {
      0% { filter: hue-rotate(0deg) drop-shadow(0 0 35px rgba(255, 0, 128, 0.95)); }
      50% { filter: hue-rotate(180deg) drop-shadow(0 0 45px rgba(0, 255, 255, 0.95)); }
      100% { filter: hue-rotate(360deg) drop-shadow(0 0 35px rgba(255, 0, 128, 0.95)); }
    }
    .rainbow-aura {
      animation: rainbow-border 2.5s linear infinite;
    }

    /* Win Cut-in dynamic slam zoom */
    @keyframes cutin-slam {
      0% { transform: scale(0.2) rotate(-8deg); opacity: 0; }
      70% { transform: scale(1.06) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .cutin-animate {
      animation: cutin-slam 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.25) forwards;
    }

    /* Top Lamp flash */
    @keyframes lamp-flash {
      0%, 100% { opacity: 0.25; filter: drop-shadow(0 0 2px transparent); }
      50% { opacity: 1; filter: drop-shadow(0 0 15px #06b6d4); }
    }
    .lamp-active {
      animation: lamp-flash 0.3s infinite alternate;
    }
  </style>
</head>

<body class="text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-x-hidden">

  <div class="w-full max-w-lg bg-gradient-to-b from-purple-950 via-slate-900 to-indigo-950 p-3 sm:p-5 rounded-3xl shadow-2xl border-4 border-fuchsia-500/60 cabinet-glow relative">
    
    <!-- Top Cyber Marquee Lamps -->
    <div class="flex items-center justify-between bg-black/70 px-4 py-2.5 rounded-2xl border-2 border-fuchsia-500/40 mb-3 backdrop-blur-sm">
      <div id="lamp-left" class="w-6 h-6 rounded-full bg-cyan-400 opacity-30 transition-all border border-cyan-200"></div>
      
      <div class="text-center">
        <h1 class="text-xl sm:text-2xl font-black italic tracking-widest bg-gradient-to-r from-cyan-400 via-pink-400 to-yellow-300 bg-clip-text text-transparent drop-shadow-[0_2px_12px_rgba(236,72,153,0.8)]">

        </h1>
      </div>

      <div id="lamp-right" class="w-6 h-6 rounded-full bg-cyan-400 opacity-30 transition-all border border-cyan-200"></div>
    </div>

    <!-- Digital Counters (Credit / Payout / Bonus Game Count) -->
    <div class="grid grid-cols-3 gap-2 bg-slate-950/80 p-2.5 rounded-2xl border border-cyan-500/30 mb-3 text-center shadow-inner">
      <div class="bg-black/80 p-1.5 rounded-xl border border-slate-800">
        <div class="text-[10px] text-pink-400 font-extrabold tracking-wider">CREDIT</div>
        <div id="disp-credit" class="font-digital text-2xl sm:text-3xl font-black text-pink-400 leading-none mt-1">50</div>
      </div>
      <div class="bg-black/80 p-1.5 rounded-xl border border-slate-800">
        <div class="text-[10px] text-emerald-400 font-extrabold tracking-wider">PAYOUT</div>
        <div id="disp-pay" class="font-digital text-2xl sm:text-3xl font-black text-emerald-400 leading-none mt-1">0</div>
      </div>
      <div class="bg-black/80 p-1.5 rounded-xl border border-slate-800">
        <div class="text-[10px] text-cyan-400 font-extrabold tracking-wider">TOTAL G</div>
        <div id="disp-games" class="font-digital text-2xl sm:text-3xl font-black text-cyan-300 leading-none mt-1">0</div>

    <!-- 1-Row 3-Reels Canvas Container -->
    <div class="relative bg-black rounded-2xl p-2.5 border-4 border-slate-800 shadow-[inset_0_10px_25px_rgba(0,0,0,0.9),0_0_20px_rgba(168,85,247,0.3)] mb-3">
      <!-- Payline neon side arrows -->
      <div class="absolute left-0 top-1/2 -translate-y-1/2 w-3.5 h-7 bg-pink-500 rounded-r-lg z-10 shadow-[0_0_12px_#ec4899]"></div>
      <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3.5 h-7 bg-pink-500 rounded-l-lg z-10 shadow-[0_0_12px_#ec4899]"></div>
      <div class="absolute left-3 right-3 top-1/2 -translate-y-1/2 h-[2px] bg-pink-500/40 z-10 pointer-events-none"></div>

      <!-- Single-Row 3 Square Reels Canvas (480 x 170) -->

    </div>

    <!-- Live Status Message Bar -->
    <div class="bg-black/90 rounded-xl py-2 px-3 mb-3 border border-pink-500/30 text-center shadow">

    <!-- Control Deck: Lever & 3 Sequential Stop Buttons -->
    <div class="bg-slate-950/80 p-3 rounded-2xl border border-fuchsia-500/30 shadow-lg">
      <div class="grid grid-cols-4 gap-2 sm:gap-3 items-center">
        <!-- Lever Button (Spin) -->

          <i class="fa-solid fa-bolt text-xl sm:text-2xl mb-0.5 text-yellow-200 animate-pulse"></i>

        <!-- 3 Sequential Stop Buttons (Left -> Center -> Right strictly enforced) -->
        <div class="col-span-3 grid grid-cols-3 gap-2">
          <!-- STOP 1 (Left) -->
          <button id="btn-stop-0" disabled class="stop-btn bg-slate-800 text-slate-400 font-black rounded-xl h-18 sm:h-20 flex flex-col items-center justify-center border-2 border-slate-700 transition-all active:scale-95 disabled:opacity-35 disabled:cursor-not-allowed">
            <span class="text-xs sm:text-sm font-extrabold">STOP 1</span>

          <!-- STOP 2 (Center) -->
          <button id="btn-stop-1" disabled class="stop-btn bg-slate-800 text-slate-400 font-black rounded-xl h-18 sm:h-20 flex flex-col items-center justify-center border-2 border-slate-700 transition-all active:scale-95 disabled:opacity-35 disabled:cursor-not-allowed">

      <!-- Top Headline -->

      </div>

      <!-- Super Large Illustration Window (Rendered on Cut-in Canvas) -->
      <div id="jackpot-avatar-frame" class="w-56 h-56 sm:w-64 sm:h-64 my-2 rounded-2xl bg-slate-950 border-4 border-amber-300 flex items-center justify-center shadow-2xl relative overflow-hidden">
        <div id="jackpot-bg-rays" class="absolute inset-0 opacity-40 bg-[radial-gradient(circle,_var(--tw-gradient-stops))] from-amber-400 via-pink-500 to-transparent animate-spin" style="animation-duration: 8s;"></div>
        
        <!-- Large Canvas view of the aligned character -->

      <!-- Character Information -->

  <script>
    // 画像URLを変更する場合は、下の 'symbols.png' をアップロード先の直リンクURLに書き換えてください。
    // 例: const SPRITE_SRC = 'https://i.postimg.cc/xxxxxx/Gemini_Generated_Image.jpg';
    const SPRITE_SRC = 'https://raw.githubusercontent.com/hsqyg971-momon-cyber/sugerG/main/symbols.png';
    // const SPRITE_SRC = 'https://raw.githubusercontent.com/hsqyg971-momon-cyber/sugerG/main/Gemini_Generated_Image.jpg';

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.reelOsc = null;
        this.reelGain = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playLever() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      startReelLoop() {
        if (!this.enabled) return;
        this.init();
        if (this.reelOsc) this.stopReelLoop();

        const now = this.ctx.currentTime;
        this.reelOsc = this.ctx.createOscillator();
        this.reelGain = this.ctx.createGain();
        this.reelOsc.type = 'triangle';
        this.reelOsc.frequency.setValueAtTime(85, now);
        this.reelGain.gain.setValueAtTime(0.06, now);
        this.reelOsc.connect(this.reelGain);
        this.reelGain.connect(this.ctx.destination);
        this.reelOsc.start();
      }

      stopReelLoop() {
        if (this.reelOsc) {
          try {
            this.reelOsc.stop();
            this.reelOsc.disconnect();
          } catch(e) {}
          this.reelOsc = null;
          this.reelGain = null;
        }
      }

      playStopTone(index) {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const freqs = [523.25, 659.25, 783.99]; // C5, E5, G5
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freqs[index] || 523, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playWinFanfare(isPremium) {
        if (!this.enabled) return;
        this.init();
        const notes = isPremium 
          ? [523, 659, 783, 1046, 1318, 1567, 2093] 
          : [440, 554, 659, 880];
        const step = isPremium ? 0.08 : 0.11;
        
        notes.forEach((freq, i) => {
          const now = this.ctx.currentTime + (i * step);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = isPremium ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + step * 1.6);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + step * 1.6);
        });
      }
    }

    const sound = new SoundEngine();

    // Sound toggle listener
    const btnSoundToggle = document.getElementById('btn-sound-toggle');
    const soundIcon = document.getElementById('sound-icon');
    btnSoundToggle.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      if (sound.enabled) {
        sound.init();
        soundIcon.className = "fa-solid fa-volume-high";
        btnSoundToggle.querySelector('span').textContent = "サウンド: ON";
      } else {
        sound.stopReelLoop();
        soundIcon.className = "fa-solid fa-volume-xmark";
        btnSoundToggle.querySelector('span').textContent = "サウンド: OFF";
      }
    });

    const SYMBOLS = [
      // Row 0
      { id: 'normal', name: 'NORMAL (クラシック)', col: 0, row: 0, payout: 15, isBushbaby: false, frameColor: '#ec4899', titleColor: '#38bdf8' },
      { id: 'white_face', name: 'WHITE FACE', col: 1, row: 0, payout: 15, isBushbaby: false, frameColor: '#ec4899', titleColor: '#f1f5f9' },
      { id: 'mosaic', name: 'MOSAIC', col: 2, row: 0, payout: 15, isBushbaby: false, frameColor: '#06b6d4', titleColor: '#ec4899' },
      { id: 'leucistic', name: 'LEUCISTIC', col: 3, row: 0, payout: 15, isBushbaby: false, frameColor: '#06b6d4', titleColor: '#38bdf8' },
      // Row 1
      { id: 'platinum', name: 'PLATINUM', col: 0, row: 1, payout: 15, isBushbaby: false, frameColor: '#06b6d4', titleColor: '#38bdf8' },
      { id: 'albino', name: 'ALBINO', col: 1, row: 1, payout: 15, isBushbaby: false, frameColor: '#06b6d4', titleColor: '#f8fafc' },
      { id: 'crimino', name: 'CRIMINO', col: 2, row: 1, payout: 15, isBushbaby: false, frameColor: '#06b6d4', titleColor: '#ec4899' },
      // Bushbaby (Ultra rare, 5% win chance, never stops unless it's a win)
      { id: 'bushbaby', name: 'BUSHBABY (ショウガラコ)', col: 3, row: 1, payout: 100, isBushbaby: true, frameColor: '#facc15', titleColor: '#facc15' }
    ];

    const SYMBOL_MAP = {};
    SYMBOLS.forEach(s => SYMBOL_MAP[s.id] = s);
    const NORMAL_SYMBOLS = SYMBOLS.filter(s => !s.isBushbaby);

    /*
      Builds a self-contained 1600x900 graphic sprite sheet replicating:
      - The dark starry neon background
      - Glowing rounded neon card frames with matching color borders
      - Paws, body silhouettes, rounded ears with inner pink shading
      - Exact coat patterns: classic dorsal stripe, mosaic spots, albino pink eyes, crimino warm cream coat, bushbaby giant amber eyes
      - The neon typography labels
    */
    function generateEmbeddedSpriteSheet() {
      const fbCanvas = document.createElement('canvas');
      fbCanvas.width = 1600;
      fbCanvas.height = 900;
      const fctx = fbCanvas.getContext('2d');
      const cellW = fbCanvas.width / 4;  // 400
      const cellH = fbCanvas.height / 2; // 450

      // Cyber starry backdrop
      const bgGrad = fctx.createRadialGradient(800, 450, 50, 800, 450, 950);
      bgGrad.addColorStop(0, '#100d29');
      bgGrad.addColorStop(0.6, '#080516');
      bgGrad.addColorStop(1, '#020108');
      fctx.fillStyle = bgGrad;
      fctx.fillRect(0, 0, fbCanvas.width, fbCanvas.height);

      // Random micro cyber sparkles in background
      for (let i = 0; i < 45; i++) {
        fctx.fillStyle = (i % 2 === 0) ? '#f472b6' : '#38bdf8';
        fctx.beginPath();
        const sx = (i * 137) % fbCanvas.width;
        const sy = (i * 243) % fbCanvas.height;
        fctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
        fctx.fill();
      }

      SYMBOLS.forEach(sym => {
        const x = sym.col * cellW;
        const y = sym.row * cellH;
        const cx = x + cellW / 2;
        const cy = y + cellH * 0.44;

        // Card neon rounded frame
        const padX = 36;
        const padY = 22;
        const boxW = cellW - padX * 2;
        const boxH = cellH - padY * 2 - 38;

        fctx.save();
        fctx.beginPath();
        fctx.roundRect(x + padX, y + padY, boxW, boxH, 28);
        fctx.fillStyle = '#060817';
        fctx.fill();

        // Glowing border (Golden rainbow for bushbaby, neon pink/cyan for others)
        fctx.lineWidth = sym.isBushbaby ? 8 : 6;
        fctx.strokeStyle = sym.frameColor;
        fctx.shadowColor = sym.frameColor;
        fctx.shadowBlur = sym.isBushbaby ? 24 : 16;
        fctx.stroke();

        if (sym.isBushbaby) {
          // Inner rainbow rim for bushbaby
          fctx.lineWidth = 3;
          fctx.strokeStyle = '#f43f5e';
          fctx.stroke();
        }
        fctx.restore();

        // Draw Animal Character Illustration
        fctx.save();

        if (sym.isBushbaby) {
          // --- BUSHBABY (ショウガラコ) ---
          // Giant tall oval ears
          fctx.fillStyle = '#6e3810';
          fctx.beginPath();
          fctx.ellipse(cx - 78, cy - 65, 38, 56, -0.4, 0, Math.PI * 2);
          fctx.ellipse(cx + 78, cy - 65, 38, 56, 0.4, 0, Math.PI * 2);
          fctx.fill();

          // Inner pink ears
          fctx.fillStyle = '#fb7185';
          fctx.beginPath();
          fctx.ellipse(cx - 78, cy - 65, 24, 40, -0.4, 0, Math.PI * 2);
          fctx.ellipse(cx + 78, cy - 65, 24, 40, 0.4, 0, Math.PI * 2);
          fctx.fill();

          // Body & Head
          fctx.fillStyle = '#9a5e1d';
          fctx.beginPath();
          fctx.ellipse(cx, cy + 28, 86, 70, 0, 0, Math.PI * 2);
          fctx.fill();

          // Golden chest & belly fur
          fctx.fillStyle = '#d97706';
          fctx.beginPath();
          fctx.ellipse(cx, cy + 42, 62, 50, 0, 0, Math.PI * 2);
          fctx.fill();

          // Paws
          fctx.fillStyle = '#fda4af';
          [-40, -20, 20, 40].forEach(px => {
            fctx.beginPath();
            fctx.ellipse(cx + px, cy + 86, 9, 6, 0, 0, Math.PI * 2);
            fctx.fill();
          });

          // Head dome
          fctx.fillStyle = '#9a5e1d';
          fctx.beginPath();
          fctx.ellipse(cx, cy - 5, 78, 62, 0, 0, Math.PI * 2);
          fctx.fill();

          // Muzzle
          fctx.fillStyle = '#fde68a';
          fctx.beginPath();
          fctx.ellipse(cx, cy + 24, 30, 20, 0, 0, Math.PI * 2);
          fctx.fill();
          fctx.fillStyle = '#f43f5e';
          fctx.beginPath();
          fctx.ellipse(cx, cy + 18, 7, 5, 0, 0, Math.PI * 2);
          fctx.fill();

          // Giant glowing amber eyes
          [-42, 42].forEach(ox => {
            // Dark ring
            fctx.fillStyle = '#451a03';
            fctx.beginPath();
            fctx.arc(cx + ox, cy - 8, 33, 0, Math.PI * 2);
            fctx.fill();

            // Amber iris
            const irisGrad = fctx.createRadialGradient(cx + ox, cy - 8, 4, cx + ox, cy - 8, 30);
            irisGrad.addColorStop(0, '#fef08a');
            irisGrad.addColorStop(0.5, '#f59e0b');
            irisGrad.addColorStop(1, '#b45309');
            fctx.fillStyle = irisGrad;
            fctx.beginPath();
            fctx.arc(cx + ox, cy - 8, 29, 0, Math.PI * 2);
            fctx.fill();

            // Black pupil
            fctx.fillStyle = '#0f172a';
            fctx.beginPath();
            fctx.arc(cx + ox, cy - 8, 18, 0, Math.PI * 2);
            fctx.fill();

            // Highlights
            fctx.fillStyle = '#ffffff';
            fctx.beginPath();
            fctx.arc(cx + ox - 8, cy - 16, 7, 0, Math.PI * 2);
            fctx.arc(cx + ox + 7, cy - 3, 3.5, 0, Math.PI * 2);
            fctx.fill();
          });

        } else {
          // --- SUGAR GLIDER CHARACTERS (モモンガ) ---
          let furColor = '#64748b';
          let eyeColor = '#0f172a';
          let bellyColor = '#f1f5f9';
          let hasStripe = false;
          let stripeColor = '#1e293b';

          if (sym.id === 'normal') {
            furColor = '#64748b';
            hasStripe = true;
          } else if (sym.id === 'white_face') {
            furColor = '#94a3b8';
            bellyColor = '#ffffff';
          } else if (sym.id === 'mosaic') {
            furColor = '#94a3b8';
          } else if (sym.id === 'leucistic') {
            furColor = '#f8fafc';
            bellyColor = '#ffffff';
          } else if (sym.id === 'platinum') {
            furColor = '#cbd5e1';
            hasStripe = true;
            stripeColor = '#475569';
          } else if (sym.id === 'albino') {
            furColor = '#ffffff';
            bellyColor = '#ffffff';
            eyeColor = '#dc2626'; // ruby red eyes
          } else if (sym.id === 'crimino') {
            furColor = '#fef3c7'; // warm cream
            bellyColor = '#fffbeb';
            eyeColor = '#991b1b'; // garnet red eyes
            hasStripe = true;
            stripeColor = '#d97706';
          }

          // Rounded Glider Ears
          fctx.fillStyle = furColor;
          fctx.beginPath();
          fctx.ellipse(cx - 72, cy - 65, 30, 44, -0.42, 0, Math.PI * 2);
          fctx.ellipse(cx + 72, cy - 65, 30, 44, 0.42, 0, Math.PI * 2);
          fctx.fill();

          // Ear inners
          fctx.fillStyle = '#fbcfe8';
          fctx.beginPath();
          fctx.ellipse(cx - 72, cy - 65, 18, 30, -0.42, 0, Math.PI * 2);
          fctx.ellipse(cx + 72, cy - 65, 18, 30, 0.42, 0, Math.PI * 2);
          fctx.fill();

          // Chubby Body
          fctx.fillStyle = furColor;
          fctx.beginPath();
          fctx.ellipse(cx, cy + 30, 94, 72, 0, 0, Math.PI * 2);
          fctx.fill();

          // Belly patch
          fctx.fillStyle = bellyColor;
          fctx.beginPath();
          fctx.ellipse(cx, cy + 38, 70, 56, 0, 0, Math.PI * 2);
          fctx.fill();

          // Mosaic spots pattern
          if (sym.id === 'mosaic') {
            fctx.fillStyle = '#334155';
            const spots = [
              [-55, 10, 16], [-35, 35, 14], [-15, 12, 10],
              [35, 8, 14], [58, 25, 18], [15, 35, 12]
            ];
            spots.forEach(([sx, sy, sr]) => {
              fctx.beginPath();
              fctx.arc(cx + sx, cy + sy, sr, 0, Math.PI * 2);
              fctx.fill();
            });
          }

          // Cute paws
          fctx.fillStyle = '#fda4af';
          [-45, -25, 25, 45].forEach(px => {
            fctx.beginPath();
            fctx.ellipse(cx + px, cy + 90, 8, 5, 0, 0, Math.PI * 2);
            fctx.fill();
          });

          // Head
          fctx.fillStyle = furColor;
          fctx.beginPath();
          fctx.ellipse(cx, cy, 76, 58, 0, 0, Math.PI * 2);
          fctx.fill();

          // White Face clear cheeks
          if (sym.id === 'white_face' || sym.id === 'leucistic' || sym.id === 'albino') {
            fctx.fillStyle = '#ffffff';
            fctx.beginPath();
            fctx.ellipse(cx, cy + 8, 62, 46, 0, 0, Math.PI * 2);
            fctx.fill();
          }

          // Classic dorsal stripe
          if (hasStripe) {
            fctx.fillStyle = stripeColor;
            fctx.beginPath();
            fctx.ellipse(cx, cy - 25, 14, 38, 0, 0, Math.PI * 2);
            fctx.fill();

            // Eye line bars
            [-44, 44].forEach(ex => {
              fctx.beginPath();
              fctx.ellipse(cx + ex, cy - 14, 18, 9, (ex < 0 ? 0.35 : -0.35), 0, Math.PI * 2);
              fctx.fill();
            });
          }

          // Muzzle & Pink Nose
          fctx.fillStyle = '#fb7185';
          fctx.beginPath();
          fctx.ellipse(cx, cy + 20, 8, 6, 0, 0, Math.PI * 2);
          fctx.fill();

          // Big glossy black or red eyes
          [-42, 42].forEach(ox => {
            fctx.fillStyle = eyeColor;
            fctx.beginPath();
            fctx.arc(cx + ox, cy - 4, 25, 0, Math.PI * 2);
            fctx.fill();

            // White eye catchlights
            fctx.fillStyle = '#ffffff';
            fctx.beginPath();
            fctx.arc(cx + ox - 7, cy - 11, 7, 0, Math.PI * 2);
            fctx.arc(cx + ox + 6, cy - 1, 3.5, 0, Math.PI * 2);
            fctx.fill();
          });
        }
        fctx.restore();

        // Neon Typography Label (Matching the uploaded graphic)
        fctx.save();
        fctx.font = '900 24px "Chakra Petch", "Orbitron", sans-serif';
        fctx.textAlign = 'center';
        fctx.fillStyle = sym.titleColor;
        fctx.shadowColor = sym.titleColor;
        fctx.shadowBlur = 12;
        fctx.fillText(sym.name, cx, y + cellH - 32);
        fctx.restore();
      });

      const img = new Image();
      img.src = fbCanvas.toDataURL('image/png');
      return img;
    }

    // Pre-generate the embedded graphic sheet
    const embeddedSpriteSheet = generateEmbeddedSpriteSheet();

    const canvas = document.getElementById('slot-canvas');
    const ctx = canvas.getContext('2d');

    const REEL_COUNT = 3;
    const REEL_SIZE = 140; // 1-row square window: 140px x 140px
    const REEL_GAP = 16;

    // Normal strip excludes Bushbaby entirely (guarantees Bushbaby never appears on lose)
    const NORMAL_STRIP = [
      'normal', 'white_face', 'mosaic', 'leucistic',
      'platinum', 'albino', 'crimino'
    ];

    class Reel {
      constructor(strip) {
        this.strip = [...strip];
        this.pos = Math.floor(Math.random() * this.strip.length);
        this.speed = 0;
        this.spinning = false;
        this.targetPos = null;
        this.decelerating = false;
      }

      setStrip(newStrip) {
        this.strip = [...newStrip];
      }

      spin() {
        this.spinning = true;
        this.decelerating = false;
        this.targetPos = null;
        this.speed = 0.38 + Math.random() * 0.04;
      }

      stopAt(targetIndex) {
        this.decelerating = true;
        const currentPos = this.pos;
        const cycles = 2; // Slide through 2 cycles for authentic pachislot feel
        let diff = (targetIndex - (currentPos % this.strip.length) + this.strip.length) % this.strip.length;
        if (diff < 1) diff += this.strip.length;
        this.targetPos = currentPos + diff + cycles * this.strip.length;
      }

      update() {
        if (!this.spinning) return;

        if (this.decelerating && this.targetPos !== null) {
          const distance = this.targetPos - this.pos;
          if (distance <= 0.05) {
            this.pos = this.targetPos % this.strip.length;
            this.speed = 0;
            this.spinning = false;
            this.decelerating = false;
            this.targetPos = null;
          } else {
            this.speed = Math.max(0.04, distance * 0.12);
            this.pos += this.speed;
          }
        } else {
          this.pos += this.speed;
        }
      }

      getCurrentSymbol() {
        const idx = Math.round(this.pos) % this.strip.length;
        return this.strip[(idx + this.strip.length) % this.strip.length];
      }
    }

    // Initialize 3 reels
    const reels = [
      new Reel(NORMAL_STRIP),
      new Reel(NORMAL_STRIP),
      new Reel(NORMAL_STRIP)
    ];

    function drawSymbolSprite(targetCtx, symKey, dx, dy, dWidth, dHeight) {
      const sym = SYMBOL_MAP[symKey];
      if (!sym || !embeddedSpriteSheet.complete) return;

      const sw = embeddedSpriteSheet.naturalWidth / 4;
      const sh = embeddedSpriteSheet.naturalHeight / 2;

      // Tight crop around character and neon box
      const insetX = sw * 0.04;
      const insetY = sh * 0.02;
      const sx = sym.col * sw + insetX;
      const sy = sym.row * sh + insetY;
      const cropW = sw - insetX * 2;
      const cropH = sh - insetY * 2;

      targetCtx.drawImage(embeddedSpriteSheet, sx, sy, cropW, cropH, dx, dy, dWidth, dHeight);
    }

    function renderReels() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const totalReelsWidth = REEL_COUNT * REEL_SIZE + (REEL_COUNT - 1) * REEL_GAP;
      const startX = (canvas.width - totalReelsWidth) / 2;
      const startY = (canvas.height - REEL_SIZE) / 2;

      reels.forEach((reel, rIdx) => {
        reel.update();
        const rx = startX + rIdx * (REEL_SIZE + REEL_GAP);
        const ry = startY;

        // Clip to square 1-symbol single-row window
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(rx, ry, REEL_SIZE, REEL_SIZE, 18);
        ctx.clip();

        // Dark cabinet cell background
        ctx.fillStyle = '#060714';
        ctx.fillRect(rx, ry, REEL_SIZE, REEL_SIZE);

        const baseIndex = Math.floor(reel.pos);
        const offset = (reel.pos - baseIndex) * REEL_SIZE;

        // Draw 3 symbols vertically (above, center, below) for smooth scrolling
        for (let i = -1; i <= 1; i++) {
          const symIndex = (baseIndex + i + reel.strip.length * 100) % reel.strip.length;
          const symbolKey = reel.strip[symIndex];
          const sy = ry + i * REEL_SIZE - offset;

          drawSymbolSprite(ctx, symbolKey, rx + 4, sy + 4, REEL_SIZE - 8, REEL_SIZE - 8);
        }

        // Inner 3D cylinder shade overlay for authentic reel depth
        const grad = ctx.createLinearGradient(rx, ry, rx, ry + REEL_SIZE);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0.7)');
        grad.addColorStop(0.2, 'rgba(0, 0, 0, 0.05)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.08)');
        grad.addColorStop(0.8, 'rgba(0, 0, 0, 0.05)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(rx, ry, REEL_SIZE, REEL_SIZE);

        // Frame Border with glowing highlight
        ctx.strokeStyle = reel.spinning ? '#06b6d4' : '#64748b';
        ctx.lineWidth = 3;
        ctx.strokeRect(rx, ry, REEL_SIZE, REEL_SIZE);

        ctx.restore();
      });

      requestAnimationFrame(renderReels);
    }

    requestAnimationFrame(renderReels);

    let credit = 50;
    let payout = 0;
    let gameCount = 0;
    let isSpinning = false;
    let nextStopIndex = 0; // Strict order: 0 (Left) -> 1 (Center) -> 2 (Right)
    let roundOutcome = null;

    // DOM references
    const dispCredit = document.getElementById('disp-credit');
    const dispPay = document.getElementById('disp-pay');
    const dispGames = document.getElementById('disp-games');
    const tickerText = document.getElementById('ticker-text');
    const btnLever = document.getElementById('btn-lever');
    const stopButtons = [
      document.getElementById('btn-stop-0'),
      document.getElementById('btn-stop-1'),
      document.getElementById('btn-stop-2')
    ];
    const lampLeft = document.getElementById('lamp-left');
    const lampRight = document.getElementById('lamp-right');

    // Cut-in Modal References
    const modalJackpot = document.getElementById('modal-jackpot');
    const jackpotCard = document.getElementById('jackpot-card');
    const cutinCanvas = document.getElementById('cutin-canvas');
    const cutinCtx = cutinCanvas.getContext('2d');
    const jackpotHeadline = document.getElementById('jackpot-headline');
    const jackpotCharTitle = document.getElementById('jackpot-char-title');
    const jackpotCharDesc = document.getElementById('jackpot-char-desc');
    const jackpotCoins = document.getElementById('jackpot-coins');
    const jackpotAvatarFrame = document.getElementById('jackpot-avatar-frame');
    const btnModalClose = document.getElementById('btn-modal-close');

    function updateDisplays() {
      dispCredit.textContent = credit;
      dispPay.textContent = payout;
      dispGames.textContent = gameCount;
    }

    function setLampsActive(active) {
      if (active) {
        lampLeft.classList.add('lamp-active');
        lampRight.classList.add('lamp-active');
      } else {
        lampLeft.classList.remove('lamp-active');
        lampRight.classList.remove('lamp-active');
      }
    }

    function setStopButtonState(activeIdx) {
      stopButtons.forEach((btn, idx) => {
        if (idx === activeIdx) {
          btn.disabled = false;
          btn.classList.add('btn-active-glow', 'bg-gradient-to-b', 'from-pink-500', 'to-rose-600', 'text-white', 'border-pink-300');
          btn.classList.remove('bg-slate-800', 'text-slate-400', 'border-slate-700');
        } else {
          btn.disabled = true;
          btn.classList.remove('btn-active-glow', 'bg-gradient-to-b', 'from-pink-500', 'to-rose-600', 'text-white', 'border-pink-300');
          btn.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
        }
      });
    }

    function performLottery() {
      const rand = Math.random();

      // Rule 1: Bushbaby has 5% chance to align
      if (rand < 0.05) {
        return {
          type: 'BUSHBABY_WIN',
          targetSymbols: ['bushbaby', 'bushbaby', 'bushbaby'],
          symbol: SYMBOL_MAP['bushbaby']
        };
      }

      // Remaining 95%: Bushbaby is guaranteed to NEVER appear
      const subRand = Math.random();

      // 30% normal win
      if (subRand < 0.30) {
        const chosen = NORMAL_SYMBOLS[Math.floor(Math.random() * NORMAL_SYMBOLS.length)];
        return {
          type: 'NORMAL_WIN',
          targetSymbols: [chosen.id, chosen.id, chosen.id],
          symbol: chosen
        };
      } 
      // 35% reach miss (Left & Center match, Right misses)
      else if (subRand < 0.65) {
        const match = NORMAL_SYMBOLS[Math.floor(Math.random() * NORMAL_SYMBOLS.length)];
        let diff = NORMAL_SYMBOLS[Math.floor(Math.random() * NORMAL_SYMBOLS.length)];
        while (diff.id === match.id) {
          diff = NORMAL_SYMBOLS[Math.floor(Math.random() * NORMAL_SYMBOLS.length)];
        }
        return {
          type: 'REACH_MISS',
          targetSymbols: [match.id, match.id, diff.id],
          symbol: null
        };
      } 
      // 35% total miss
      else {
        const s0 = NORMAL_SYMBOLS[0];
        const s1 = NORMAL_SYMBOLS[1];
        const s2 = NORMAL_SYMBOLS[2];
        return {
          type: 'MISS',
          targetSymbols: [s0.id, s1.id, s2.id],
          symbol: null
        };
      }
    }

    /* LEVER ON */
    btnLever.addEventListener('click', () => {
      if (isSpinning) return;
      if (credit < 3) {
        tickerText.innerHTML = `<span class="text-pink-400">クレジット不足！50枚チャージしました！</span>`;
        credit += 50;
        updateDisplays();
        return;
      }

      credit -= 3;
      payout = 0;
      gameCount++;
      isSpinning = true;
      nextStopIndex = 0;
      updateDisplays();

      sound.playLever();
      sound.startReelLoop();
      setLampsActive(false);

      // Perform internal lottery
      roundOutcome = performLottery();

      // Only add Bushbaby to the strip if Bushbaby Win was chosen
      if (roundOutcome.type === 'BUSHBABY_WIN') {
        const bushStrip = [...NORMAL_STRIP, 'bushbaby'];
        reels.forEach(r => r.setStrip(bushStrip));
      } else {
        reels.forEach(r => r.setStrip(NORMAL_STRIP));
      }

      // Start all 3 reels
      reels.forEach(r => r.spin());

      btnLever.disabled = true;
      tickerText.textContent = "左ボタン【STOP 1】を押してください！";

      // Enable STOP 1 (Left) exclusively
      setStopButtonState(0);
    });

    /* STOP BUTTONS (Left -> Center -> Right) */
    stopButtons.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        if (!isSpinning || idx !== nextStopIndex) return;

        sound.playStopTone(idx);
        const reel = reels[idx];
        const targetSymId = roundOutcome.targetSymbols[idx];

        const currentPos = Math.ceil(reel.pos);
        let chosenIdx = null;

        for (let step = 1; step <= reel.strip.length; step++) {
          const checkIdx = (currentPos + step) % reel.strip.length;
          if (reel.strip[checkIdx] === targetSymId) {
            chosenIdx = checkIdx;
            break;
          }
        }

        reel.stopAt(chosenIdx !== null ? chosenIdx : currentPos + 2);

        nextStopIndex++;
        if (nextStopIndex < 3) {
          setStopButtonState(nextStopIndex);
          const labels = ["中", "右"];
          tickerText.textContent = `次は【${labels[nextStopIndex - 1]}】ボタンを押してください！`;
        } else {
          // All 3 reels stopped
          setStopButtonState(-1);
          sound.stopReelLoop();
          tickerText.textContent = "判定中...";
          setTimeout(evaluateGameOutcome, 500);
        }
      });
    });

    function evaluateGameOutcome() {
      isSpinning = false;
      btnLever.disabled = false;

      const s0 = reels[0].getCurrentSymbol();
      const s1 = reels[1].getCurrentSymbol();
      const s2 = reels[2].getCurrentSymbol();

      // Check if all 3 aligned
      if (s0 === s1 && s1 === s2) {
        handleWin(SYMBOL_MAP[s0]);
      } else {
        tickerText.innerHTML = `ハズレ... 次のレバーに賭けよう！ <span class="text-yellow-400">PUSH LEVER</span>`;
      }
    }

    function handleWin(symbol) {
      payout = symbol.payout;
      credit += payout;
      updateDisplays();
      setLampsActive(true);

      const isPremium = symbol.isBushbaby;
      sound.playWinFanfare(isPremium);

      tickerText.innerHTML = `<span class="text-yellow-300 font-black animate-pulse">🎉 ${symbol.name} 揃い！ ＋${symbol.payout}枚獲得！！ 🎉</span>`;

      if (typeof confetti === 'function') {
        confetti({
          particleCount: isPremium ? 160 : 90,
          spread: 90,
          origin: { y: 0.6 }
        });
      }

      setTimeout(() => {
        showCutinModal(symbol);
      }, 350);
    }

    function showCutinModal(symbol) {
      // Draw the large character into cutin-canvas (260x260)
      cutinCtx.clearRect(0, 0, cutinCanvas.width, cutinCanvas.height);
      drawSymbolSprite(cutinCtx, symbol.id, 10, 10, cutinCanvas.width - 20, cutinCanvas.height - 20);

      jackpotCharTitle.textContent = symbol.name;
      jackpotCoins.textContent = `+${symbol.payout} COINS`;

      if (symbol.isBushbaby) {
        jackpotHeadline.textContent = "★ RAINBOW PREMIUM BONUS ★";
        jackpotCharDesc.textContent = "超激レア・ショウガラコ降臨（出現率5%）！プレミアムボーナス獲得！！";
        jackpotCard.classList.add('rainbow-aura');
        jackpotAvatarFrame.className = "w-56 h-56 sm:w-64 sm:h-64 my-2 rounded-2xl bg-slate-950 border-4 border-yellow-300 flex items-center justify-center shadow-2xl relative overflow-hidden ring-4 ring-pink-500";
      } else {
        jackpotHeadline.textContent = "★ BIG BONUS ★";
        jackpotCharDesc.textContent = `${symbol.name} が3つ揃いました！おめでとうございます！`;
        jackpotCard.classList.remove('rainbow-aura');
        jackpotAvatarFrame.className = "w-56 h-56 sm:w-64 sm:h-64 my-2 rounded-2xl bg-slate-950 border-4 border-cyan-400 flex items-center justify-center shadow-2xl relative overflow-hidden";
      }

      modalJackpot.classList.remove('hidden');
    }

    btnModalClose.addEventListener('click', () => {
      modalJackpot.classList.add('hidden');
      setLampsActive(false);
      tickerText.textContent = "LEVERを押してスタート！ (1PLAY: 3枚)";
    });

    // Keyboard support: Space/Enter for Lever, 1/2/3 or Left/Down/Right for Stop
    window.addEventListener('keydown', (e) => {
      if (!modalJackpot.classList.contains('hidden')) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
          btnModalClose.click();
        }
        return;
      }

      if (e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        if (!isSpinning && !btnLever.disabled) {
          btnLever.click();
        }
      } else if (e.key === '1' || e.key === 'ArrowLeft') {
        if (nextStopIndex === 0 && !stopButtons[0].disabled) stopButtons[0].click();
      } else if (e.key === '2' || e.key === 'ArrowDown') {
        if (nextStopIndex === 1 && !stopButtons[1].disabled) stopButtons[1].click();
      } else if (e.key === '3' || e.key === 'ArrowRight') {
        if (nextStopIndex === 2 && !stopButtons[2].disabled) stopButtons[2].click();
      }
    });
  </script>
