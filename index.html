<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>フクロモモンガスロット - SUGAR GLIDER RUSH</title>
  <!-- confetti.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts & FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1b0a2a 0%, #0c0214 70%, #030005 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'M PLUS Rounded 1c', 'Orbitron', sans-serif;
      color: #fff;
      overflow-x: hidden;
      padding: 10px;
    }

    .machine-container {
      width: 100%;
      max-width: 520px;
      background: linear-gradient(180deg, #2b1055 0%, #15002a 100%);
      border: 4px solid #ff007f;
      border-radius: 28px;
      padding: 20px 16px 24px;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.45), 0 0 70px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(255, 0, 127, 0.3);
      position: relative;
    }

    /* レインボーボーナス時の外枠アニメーション */
    .machine-container.rainbow-mode {
      animation: rainbowGlow 1.5s infinite linear;
    }
    @keyframes rainbowGlow {
      0% { border-color: #ff0055; box-shadow: 0 0 40px #ff0055; }
      20% { border-color: #ffbf00; box-shadow: 0 0 40px #ffbf00; }
      40% { border-color: #00ff66; box-shadow: 0 0 40px #00ff66; }
      60% { border-color: #00f0ff; box-shadow: 0 0 40px #00f0ff; }
      80% { border-color: #b000ff; box-shadow: 0 0 40px #b000ff; }
      100% { border-color: #ff0055; box-shadow: 0 0 40px #ff0055; }
    }

    /* タイトルヘッダー */
    .title-banner {
      text-align: center;
      margin-bottom: 14px;
    }
    .title-banner h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff007f, #00f0ff, #ffe600, #ff007f);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: neonSlide 4s linear infinite;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
    }
    @keyframes neonSlide {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* スコアパネル */
    .score-board {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: #090014;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      padding: 8px 16px;
      margin-bottom: 16px;
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.4);
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .score-label {
      font-size: 11px;
      color: #00f0ff;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .score-val {
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      color: #ffe600;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.7);
    }

    /* Canvas画面（1リール1図柄の正方形スロット窓） */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border: 3px solid #ffe600;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 230, 0, 0.3);
      display: flex;
      justify-content: center;
    }
    canvas#slotCanvas {
      display: block;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 480 / 200;
    }

    /* 操作ボタンエリア */
    .controls-wrapper {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stop-buttons-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .btn-stop {
      flex: 1;
      height: 56px;
      background: linear-gradient(180deg, #444, #1a1a1a);
      border: 2px solid #666;
      border-radius: 14px;
      color: #888;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: not-allowed;
      transition: all 0.15s ease;
      box-shadow: 0 6px 0 #111;
    }
    .btn-stop.active {
      background: linear-gradient(180deg, #ffe600, #ff9900);
      border-color: #ffffff;
      color: #2b0044;
      cursor: pointer;
      box-shadow: 0 6px 0 #b36b00, 0 0 20px rgba(255, 230, 0, 0.8);
      animation: stopPulse 0.8s infinite alternate;
    }
    .btn-stop.active:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b36b00;
    }
    @keyframes stopPulse {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.25); }
    }

    .start-lever-row {
      display: flex;
      gap: 12px;
    }
    .btn-start {
      flex: 1;
      height: 60px;
      background: linear-gradient(180deg, #ff007f, #aa0055);
      border: 3px solid #ff99cc;
      border-radius: 16px;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 7px 0 #660033, 0 0 25px rgba(255, 0, 127, 0.6);
      transition: all 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .btn-start:active:not(:disabled) {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #660033;
    }
    .btn-start:disabled {
      background: #3a223a;
      border-color: #553355;
      color: #886688;
      box-shadow: 0 5px 0 #1f111f;
      cursor: not-allowed;
    }

    /* ツールバー（画像取り込み＆サウンド切り替え） */
    .tool-bar {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-upload {
      background: linear-gradient(180deg, #00f0ff, #0088cc);
      border: 1px solid #ffffff;
      color: #051424;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #005580;
    }
    .btn-upload:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #005580;
    }
    .btn-sound {
      background: #222;
      border: 1px solid #555;
      color: #aaa;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-sound.on {
      color: #00ffcc;
      border-color: #00ffcc;
    }

    /* 特大カットイン演出モーダル */
    .cutin-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      backdrop-filter: blur(8px);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .cutin-overlay.show {
      display: flex;
      opacity: 1;
    }
    .cutin-card {
      width: 90%;
      max-width: 440px;
      background: radial-gradient(circle, #2d0050 0%, #0d001a 100%);
      border: 4px solid #ffe600;
      border-radius: 24px;
      padding: 24px 16px 20px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 230, 0, 0.8);
      transform: scale(0.6);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }
    .cutin-overlay.show .cutin-card {
      transform: scale(1);
    }
    .cutin-title {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 12px;
      letter-spacing: 2px;
      color: #ffe600;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
    }
    .cutin-canvas-wrap {
      width: 240px;
      height: 240px;
      margin: 0 auto 16px;
      border-radius: 20px;
      overflow: hidden;
      border: 4px solid #fff;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
      background: #000;
    }
    .cutin-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .cutin-sub {
      font-size: 18px;
      font-weight: 900;
      color: #00f0ff;
      margin-bottom: 18px;
    }
    .btn-continue {
      background: linear-gradient(180deg, #ffe600, #ff8800);
      color: #2b0044;
      font-size: 18px;
      font-weight: 900;
      padding: 12px 32px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      box-shadow: 0 5px 0 #995500, 0 0 25px rgba(255, 230, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="machine-container" id="machine">
    <!-- タイトル -->
    <div class="title-banner">
      <h1>★ SUGAR GLIDER RUSH ★</h1>
    </div>

    <!-- スコアボード -->
    <div class="score-board">
      <div class="score-item">
        <span class="score-label">CREDIT</span>
        <span class="score-val" id="creditVal">50</span>
      </div>
      <div class="score-item">
        <span class="score-label">PAYOUT</span>
        <span class="score-val" id="payoutVal">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">STATUS</span>
        <span class="score-val" id="statusVal" style="font-size: 15px; color: #00ffcc;">READY</span>
      </div>
    </div>

    <!-- スロットリール表示領域（1リール1図柄） -->
    <div class="canvas-wrapper">
      <canvas id="slotCanvas" width="480" height="200"></canvas>
    </div>

    <!-- 操作ボタン部 -->
    <div class="controls-wrapper">
      <div class="stop-buttons-row">
        <button class="btn-stop" id="btnStop0" disabled>
          <span>STOP 1</span>
          <small>左</small>
        </button>
        <button class="btn-stop" id="btnStop1" disabled>
          <span>STOP 2</span>
          <small>中</small>
        </button>
        <button class="btn-stop" id="btnStop2" disabled>
          <span>STOP 3</span>
          <small>右</small>
        </button>
      </div>

      <div class="start-lever-row">
        <button class="btn-start" id="btnStart">
          <i class="fa-solid fa-bolt"></i> START LEVER
        </button>
      </div>
    </div>

    <!-- ツールバー：画像選択＆音量切替 -->
    <div class="tool-bar">
      <!-- 隠しファイル入力 -->
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
      <button class="btn-upload" id="btnTriggerUpload">
        <i class="fa-solid fa-image"></i> 画像を取り込む
      </button>

      <button class="btn-sound on" id="btnSound">
        <i class="fa-solid fa-volume-high"></i> SOUND ON
      </button>
    </div>
  </div>

  <!-- 当たりカットインモーダル -->
  <div class="cutin-overlay" id="cutinOverlay">
    <div class="cutin-card" id="cutinCard">
      <div class="cutin-title" id="cutinTitle">JACKPOT!</div>
      <div class="cutin-canvas-wrap">
        <canvas id="cutinCanvas" width="240" height="240"></canvas>
      </div>
      <div class="cutin-sub" id="cutinSub">NORMAL WIN +15 COINS</div>
      <button class="btn-continue" id="btnContinue">CONTINUE</button>
    </div>
  </div>

  <script>
    /* ========================================================
       1. 基本定数・図柄データ設定
       ======================================================== */
    let spriteImage = new Image();
    let isSpriteLoaded = false;

    // 初期読み込みを試みるパス（同階層のsymbols.png）
    spriteImage.src = 'symbols.png';
    spriteImage.onload = () => { isSpriteLoaded = true; };

    // 8種類の図柄データ (横4列 × 縦2行)
    const SYMBOLS = [
      { id: 0, name: 'NORMAL',     col: 0, row: 0, pay: 15,  isRare: false },
      { id: 1, name: 'WHITE FACE', col: 1, row: 0, pay: 20,  isRare: false },
      { id: 2, name: 'MOSAIC',     col: 2, row: 0, pay: 25,  isRare: false },
      { id: 3, name: 'LEUCISTIC',  col: 3, row: 0, pay: 30,  isRare: false },
      { id: 4, name: 'PLATINUM',   col: 0, row: 1, pay: 35,  isRare: false },
      { id: 5, name: 'ALBINO',     col: 1, row: 1, pay: 40,  isRare: false },
      { id: 6, name: 'CRIMINO',    col: 2, row: 1, pay: 50,  isRare: false },
      { id: 7, name: 'BUSHBABY',   col: 3, row: 1, pay: 100, isRare: true  } // 5%完全確定激レア
    ];

    // 通常時にリール上で循環する通常フクロモモンガ7種類（ショウガラコはハズレ時に完全排除）
    const NORMAL_STRIP = [0, 1, 2, 3, 4, 5, 6, 0, 2, 4, 1, 3, 5, 6];

    /* ========================================================
       2. Web Audio API サウンドシステム
       ======================================================== */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.15) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function soundStart() {
      playTone(440, 0.08, 'triangle', 0.2);
      setTimeout(() => playTone(880, 0.15, 'sine', 0.2), 60);
    }
    function soundStop(idx) {
      const freqs = [523.25, 659.25, 783.99]; // ド・ミ・ソ
      playTone(freqs[idx] || 600, 0.1, 'square', 0.18);
    }
    function soundFanfare(isRare) {
      if (!soundEnabled || !audioCtx) return;
      const notes = isRare 
        ? [523, 659, 783, 1046, 783, 1046, 1318, 1567] 
        : [523, 659, 783, 1046];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          playTone(freq, 0.22, isRare ? 'square' : 'triangle', 0.22);
        }, i * 110);
      });
    }

    /* ========================================================
       3. リール物理制御クラス
       ======================================================== */
    const canvas = document.getElementById('slotCanvas');
    const ctx = canvas.getContext('2d');

    const REEL_CONFIG = {
      count: 3,
      windowW: 130,
      windowH: 140,
      gap: 16,
      startX: 31,
      y: 30
    };

    class Reel {
      constructor(index) {
        this.index = index;
        this.strip = [...NORMAL_STRIP];
        this.offset = Math.floor(Math.random() * this.strip.length);
        this.speed = 0;
        this.maxSpeed = 22;
        this.spinning = false;
        this.stopping = false;
        this.targetSymbol = null;
      }

      start() {
        this.spinning = true;
        this.stopping = false;
        this.speed = this.maxSpeed;
      }

      requestStop(targetSymId) {
        this.targetSymbol = targetSymId;
        this.stopping = true;
      }

      update() {
        if (!this.spinning) return;
        this.offset = (this.offset + this.speed / 40) % this.strip.length;

        if (this.stopping) {
          const currentSym = this.strip[Math.floor(this.offset) % this.strip.length];
          // ターゲット絵柄付近に到達したらスベリを減速してピタッと停止
          if (currentSym === this.targetSymbol) {
            const frac = this.offset - Math.floor(this.offset);
            if (frac < 0.18 || this.speed < 4) {
              this.offset = Math.floor(this.offset);
              this.speed = 0;
              this.spinning = false;
              this.stopping = false;
              onReelStopped(this.index);
            } else {
              this.speed = Math.max(2, this.speed * 0.85);
            }
          }
        }
      }

      getCurrentSymbol() {
        return this.strip[Math.floor(this.offset) % this.strip.length];
      }
    }

    const reels = [new Reel(0), new Reel(1), new Reel(2)];

    /* ========================================================
       4. Canvas 描画エンジン（切り抜き＆フォールバック）
       ======================================================== */
    function drawSymbolImage(targetCtx, symId, dx, dy, dw, dh) {
      const sym = SYMBOLS[symId];
      if (isSpriteLoaded && spriteImage.complete && spriteImage.naturalWidth > 0) {
        const sw = spriteImage.naturalWidth / 4;
        const sh = spriteImage.naturalHeight / 2;
        const sx = sym.col * sw;
        const sy = sym.row * sh;
        targetCtx.drawImage(spriteImage, sx, sy, sw, sh, dx, dy, dw, dh);
      } else {
        // 画像未読み込み時のフォールバックベクター描画
        targetCtx.save();
        targetCtx.fillStyle = '#110022';
        targetCtx.fillRect(dx, dy, dw, dh);
        targetCtx.strokeStyle = sym.isRare ? '#ffe600' : '#00f0ff';
        targetCtx.lineWidth = 3;
        targetCtx.strokeRect(dx + 4, dy + 4, dw - 8, dh - 8);

        // アイコン＆文字
        targetCtx.fillStyle = sym.isRare ? '#ffe600' : '#ffffff';
        targetCtx.font = 'bold 26px Orbitron';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText(sym.isRare ? '★' : '●', dx + dw / 2, dy + dh / 2 - 12);

        targetCtx.font = 'bold 13px Orbitron';
        targetCtx.fillText(sym.name, dx + dw / 2, dy + dh / 2 + 24);
        targetCtx.restore();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < REEL_CONFIG.count; i++) {
        const reel = reels[i];
        reel.update();

        const rx = REEL_CONFIG.startX + i * (REEL_CONFIG.windowW + REEL_CONFIG.gap);
        const ry = REEL_CONFIG.y;
        const rw = REEL_CONFIG.windowW;
        const rh = REEL_CONFIG.windowH;

        // リール窓の外枠描画
        ctx.save();
        ctx.fillStyle = '#0a0014';
        ctx.fillRect(rx, ry, rw, rh);

        // 枠内クリッピング（1リール1図柄の正方形表示）
        ctx.beginPath();
        ctx.rect(rx, ry, rw, rh);
        ctx.clip();

        // リール描画（回転スクロール）
        const offset = reel.offset;
        const baseIdx = Math.floor(offset);
        const frac = offset - baseIdx;

        // 前後2コマを描画してスムーズな縦回転を表現
        for (let pos = -1; pos <= 1; pos++) {
          const symIdx = (baseIdx + pos + reel.strip.length * 100) % reel.strip.length;
          const symId = reel.strip[symIdx];
          const itemY = ry + (pos - frac) * rh;
          drawSymbolImage(ctx, symId, rx + 4, itemY + 4, rw - 8, rh - 8);
        }

        // リール上下の立体感シャドウ
        const grad = ctx.createLinearGradient(rx, ry, rx, ry + rh);
        grad.addColorStop(0, 'rgba(0,0,0,0.7)');
        grad.addColorStop(0.18, 'rgba(0,0,0,0)');
        grad.addColorStop(0.82, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.7)');
        ctx.fillStyle = grad;
        ctx.fillRect(rx, ry, rw, rh);

        ctx.restore();

        // 窓枠のネオン枠
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#00f0ff';
        ctx.strokeRect(rx, ry, rw, rh);
      }

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    /* ========================================================
       5. ゲームロジック＆ショウガラコ5%特殊抽選
       ======================================================== */
    let credit = 50;
    let payout = 0;
    let isSpinning = false;
    let currentStopStep = 0; // 0: 左, 1: 中, 2: 右
    let targetStops = [0, 0, 0];

    const creditValEl = document.getElementById('creditVal');
    const payoutValEl = document.getElementById('payoutVal');
    const statusValEl = document.getElementById('statusVal');
    const machineEl = document.getElementById('machine');

    const btnStart = document.getElementById('btnStart');
    const stopBtns = [
      document.getElementById('btnStop0'),
      document.getElementById('btnStop1'),
      document.getElementById('btnStop2')
    ];

    function updateStopButtons() {
      stopBtns.forEach((btn, idx) => {
        if (isSpinning && idx === currentStopStep) {
          btn.disabled = false;
          btn.classList.add('active');
        } else {
          btn.disabled = true;
          btn.classList.remove('active');
        }
      });
    }

    // レバーON（スタート）
    btnStart.addEventListener('click', () => {
      initAudio();
      if (isSpinning || credit < 3) return;

      credit -= 3;
      creditValEl.textContent = credit;
      payout = 0;
      payoutValEl.textContent = payout;
      statusValEl.textContent = 'SPINNING';
      statusValEl.style.color = '#ffe600';
      machineEl.classList.remove('rainbow-mode');

      soundStart();

      // ==========================================
      // 【内部抽選ロジック】
      // 5%の確率でショウガラコ揃い（激レアプレミアム）
      // 残り95%で通常モモンガの当たりまたはハズレ
      // ==========================================
      const rand = Math.random();

      if (rand < 0.05) {
        // ★ 5%当選：ショウガラコ揃い
        targetStops = [7, 7, 7];
        reels.forEach(r => {
          r.strip = [7, 0, 7, 2, 7, 4, 7]; // リールにショウガラコを装填
        });
      } else {
        // 通常抽選（ショウガラコはハズレに一切出現させない）
        reels.forEach(r => {
          r.strip = [...NORMAL_STRIP];
        });

        // 35%の確率で通常図柄揃い、60%でハズレ
        const isNormalWin = Math.random() < 0.35;
        if (isNormalWin) {
          const winSym = Math.floor(Math.random() * 7); // 0〜6
          targetStops = [winSym, winSym, winSym];
        } else {
          // ハズレ（リーチまたはバラケ目）
          const s1 = Math.floor(Math.random() * 7);
          const s2 = (Math.random() < 0.5) ? s1 : Math.floor(Math.random() * 7);
          let s3 = Math.floor(Math.random() * 7);
          if (s1 === s2 && s3 === s1) {
            s3 = (s1 + 1) % 7; // 揃いを回避
          }
          targetStops = [s1, s2, s3];
        }
      }

      // リール回転開始
      reels.forEach(r => r.start());
      isSpinning = true;
      btnStart.disabled = true;
      currentStopStep = 0;
      updateStopButtons();
    });

    // ストップボタン押下（左→中→右の順序強制）
    stopBtns.forEach((btn, idx) => {
      btn.addEventListener('click', () => {
        if (!isSpinning || idx !== currentStopStep) return;
        soundStop(idx);
        reels[idx].requestStop(targetStops[idx]);
        btn.disabled = true;
        btn.classList.remove('active');
        currentStopStep++;
        updateStopButtons();
      });
    });

    function onReelStopped(reelIndex) {
      // 3つ目のリールが止まったら当たり判定
      if (reelIndex === 2) {
        isSpinning = false;
        btnStart.disabled = false;
        checkWin();
      }
    }

    function checkWin() {
      const s0 = reels[0].getCurrentSymbol();
      const s1 = reels[1].getCurrentSymbol();
      const s2 = reels[2].getCurrentSymbol();

      if (s0 === s1 && s1 === s2) {
        const winSym = SYMBOLS[s0];
        payout = winSym.pay;
        credit += payout;
        creditValEl.textContent = credit;
        payoutValEl.textContent = payout;

        statusValEl.textContent = winSym.isRare ? 'PREMIUM BONUS!' : 'BIG BONUS!';
        statusValEl.style.color = winSym.isRare ? '#ff00ff' : '#ffe600';

        if (winSym.isRare) {
          machineEl.classList.add('rainbow-mode');
        }

        soundFanfare(winSym.isRare);
        showCutin(winSym);
      } else {
        statusValEl.textContent = 'REPLAY';
        statusValEl.style.color = '#00f0ff';
      }
    }

    /* ========================================================
       6. 特大カットイン＆紙吹雪演出
       ======================================================== */
    const cutinOverlay = document.getElementById('cutinOverlay');
    const cutinCard = document.getElementById('cutinCard');
    const cutinTitle = document.getElementById('cutinTitle');
    const cutinSub = document.getElementById('cutinSub');
    const cutinCanvas = document.getElementById('cutinCanvas');
    const cutinCtx = cutinCanvas.getContext('2d');
    const btnContinue = document.getElementById('btnContinue');

    function showCutin(sym) {
      cutinCtx.clearRect(0, 0, cutinCanvas.width, cutinCanvas.height);
      drawSymbolImage(cutinCtx, sym.id, 0, 0, cutinCanvas.width, cutinCanvas.height);

      if (sym.isRare) {
        cutinTitle.textContent = '★ RAINBOW PREMIUM ★';
        cutinTitle.style.color = '#ff00ff';
        cutinSub.textContent = `BUSHBABY 激レア揃い！ +${sym.pay} COINS`;
        cutinCard.style.borderColor = '#00f0ff';
      } else {
        cutinTitle.textContent = '★ BIG BONUS! ★';
        cutinTitle.style.color = '#ffe600';
        cutinSub.textContent = `${sym.name} 揃い！ +${sym.pay} COINS`;
        cutinCard.style.borderColor = '#ffe600';
      }

      cutinOverlay.classList.add('show');

      // 紙吹雪エフェクト
      confetti({
        particleCount: sym.isRare ? 180 : 90,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    btnContinue.addEventListener('click', () => {
      cutinOverlay.classList.remove('show');
    });

    /* ========================================================
       7. 画像取り込み＆サウンド切り替え
       ======================================================== */
    const fileInput = document.getElementById('fileInput');
    const btnTriggerUpload = document.getElementById('btnTriggerUpload');
    const btnSound = document.getElementById('btnSound');

    // 「画像を取り込む」ボタンクリックで隠しinputを発火
    btnTriggerUpload.addEventListener('click', () => {
      fileInput.click();
    });

    // ファイル選択完了時の即時反映処理
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        spriteImage = new Image();
        spriteImage.onload = () => {
          isSpriteLoaded = true;
          alert('画像の取り込みが完了しました！リール図柄に反映されます。');
        };
        spriteImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // サウンド切替
    btnSound.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      btnSound.classList.toggle('on', soundEnabled);
      btnSound.innerHTML = soundEnabled 
        ? '<i class="fa-solid fa-volume-high"></i> SOUND ON' 
        : '<i class="fa-solid fa-volume-xmark"></i> SOUND OFF';
    });
  </script>
</body>
</html>
